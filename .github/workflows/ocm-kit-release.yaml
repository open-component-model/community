name: ocm-kit release
on:
  push:
    tags:
      - 'ocm-kit/v*'
permissions:
  contents: write
jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Source the Go version from the dev flake so CI matches local development.
      - id: goversion
        working-directory: ocm-kit
        run: |
          echo "version=$(grep -oE 'goVersion = "[^"]+"' flake.nix | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache-dependency-path: ocm-kit/go.sum
      - name: Build release artifacts
        working-directory: ocm-kit
        env:
          # Tag is "ocm-kit/vX.Y.Z"; the module version is the "vX.Y.Z" part.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#ocm-kit/}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            bin="ocm-kit"; [ "$os" = "windows" ] && bin="ocm-kit.exe"
            name="ocm-kit_${version}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/${bin}" ./cmd/ocm-kit
            cp LICENSE README.md "dist/${name}/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
            rm -rf "dist/${name}"
          done
          (cd dist && sha256sum ocm-kit_*.tar.gz ocm-kit_*.zip > "ocm-kit_${version}_SHA256SUMS")
          ls -l dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ocm-kit ${{ github.ref_name }}
          files: ocm-kit/dist/*

  image:
    name: Build, sign and attest image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing and attestation (Sigstore OIDC)
    env:
      IMAGE: ghcr.io/open-component-model/community/ocm-kit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        # Tag is "ocm-kit/vX.Y.Z"; the image version is the "vX.Y.Z" part.
        run: echo "value=${GITHUB_REF_NAME#ocm-kit/}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
      # Builds with SLSA provenance (mode=max) and an SPDX SBOM attestation,
      # both attached to the image manifest in the registry.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ocm-kit
          file: ocm-kit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
      # Keyless signature over the (immutable) image digest.
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # Scan the pushed image for known vulnerabilities. exit-code 0 records all
      # findings without failing the release.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: cosign-vuln
          output: vuln.json
          exit-code: '0'
      # Attach the vulnerability report as a signed 'vuln' attestation.
      - name: Attest vulnerability scan
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type vuln --predicate vuln.json "${IMAGE}@${DIGEST}"
